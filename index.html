<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미국 ETF 투자 계산기</title><style>body{margin:0;background:#f5f6f8;color:#15171a;font:15px system-ui,-apple-system,sans-serif}main{max-width:1060px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e4e6eb;border-radius:16px;padding:22px;margin:14px 0}.stat{font-size:26px;font-weight:750}label{display:block;color:#666;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px}button{padding:10px 17px;border:1px solid #ddd;border-radius:9px;background:#fff;cursor:pointer}button.active{background:#15171a;color:#fff}.muted{color:#777;font-size:13px}.up{color:#c43d48}.down{color:#167a5b}.result{background:#f6f7f9;padding:16px;border-radius:12px;margin-top:16px;line-height:2}small{color:#777}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:14px}}</style></head><body><main><h1>미국 ETF 투자 대시보드</h1><p class="muted">NASDAQ-100 · S&P 500 · QLD · SPY · QQQI · JEPQ</p><div class="grid"><div class="card"><b>NASDAQ-100</b><div class="stat" id="nas">불러오는 중</div><span id="naschg" class="muted"></span></div><div class="card"><b>S&P 500</b><div class="stat" id="sp">불러오는 중</div><span id="spchg" class="muted"></span></div></div><div class="card"><h2>장기투자 계산기</h2><div><button class="active" id="qld" onclick="pick('QLD')">QLD</button> <button id="spy" onclick="pick('SPY')">SPY</button></div><div class="grid"><div><label>투자 방식</label><select id="mode"><option value="lump">거치식</option><option value="monthly" selected>월 적립식</option><option value="daily">월 20거래일 적립식</option></select></div><div><label>투자 기간 (년)</label><input id="years" type="number" value="10" min="1" max="50"></div><div><label>초기 투자금 (원)</label><input id="initial" type="number" value="10000000"></div><div><label>월 적립금 또는 거래일당 투자금 (원)</label><input id="monthly" type="number" value="600000"></div><div><label>연평균 수익률 가정 (%)</label><input id="rate" type="number" value="10" step=".1"><small id="hist">과거 수익률 조회 중</small></div><div><label>목표 금액 (원)</label><input id="goal" type="number" value="100000000"></div><div><label>ETF 1주 가격 (USD)</label><input id="price" type="number" value="100" step=".01"></div><div><label>원/달러 환율</label><input id="fx" type="number" value="1400" step=".1"></div><div><label>목표 매수 주식 수</label><input id="targetShares" type="number" value="100"></div></div><div class="result" id="investmentResult"></div></div><div class="card"><h2>월분배금 계산기</h2><button class="active" id="qqqi" onclick="pickDiv('QQQI')">QQQI</button> <button id="jepq" onclick="pickDiv('JEPQ')">JEPQ</button><div class="grid"><div><label>보유 주식 수</label><input id="shares" type="number" value="100"></div><div><label>주당 가격 (USD)</label><input id="divPrice" type="number" value="50" step=".01"></div><div><label>주당 월분배금 (USD)</label><input id="distribution" type="number" value=".5" step=".001"></div><div><label>월 목표 세후 분배금 (원)</label><input id="incomeGoal" type="number" value="500000"></div><div><label>원/달러 환율</label><input id="divFx" type="number" value="1400"></div><div><label>원천징수율 가정 (%)</label><input id="tax" type="number" value="15"></div></div><div class="result" id="divResult"></div><p class="muted">분배금은 매월 달라지며 원천징수 및 국내 세금은 분배금 성격과 개인 상황에 따라 다를 수 있습니다.</p></div><p class="muted" id="status">시세는 지연될 수 있습니다. 과거 성과는 미래 수익을 보장하지 않으며 QLD는 일일 2배 레버리지 ETF입니다. 시뮬레이션은 일정 수익률 가정, 환율 변동·세금·거래비용 제외입니다.</p></main><script>let etf='QLD',divEtf='QQQI';const $=id=>document.getElementById(id),num=id=>Number($(id).value)||0,money=n=>Math.round(n).toLocaleString('ko-KR')+'원';function pick(x){etf=x;$('qld').className=x==='QLD'?'active':'';$('spy').className=x==='SPY'?'active':'';loadEtf();calc()}function pickDiv(x){divEtf=x;$('qqqi').className=x==='QQQI'?'active':'';$('jepq').className=x==='JEPQ'?'active':'';loadDiv();calc()}function calc(){let months=Math.max(0,num('years')*12),m=$('mode').value==='lump'?0:num('monthly')*($('mode').value==='daily'?20:1),r=Math.pow(Math.max(.001,1+num('rate')/100),1/12)-1,v=num('initial'),paid=v;for(let i=0;i<months;i++){v=v*(1+r)+m;paid+=m}let unit=num('price')*num('fx'),goal=num('goal'),g=num('initial'),steps=0;while(g<goal&&steps<1200){g=g*(1+r)+m;steps++}let target=goal<=num('initial')?'이미 달성':steps===1200?'100년 이내 미달성':Math.floor(steps/12)+'년 '+steps%12+'개월';$('investmentResult').innerHTML='<b>'+num('years')+'년 후 예상 평가액: '+money(v)+'</b><br>총 원금: '+money(paid)+'<br>예상 수익: '+money(v-paid)+'<br>수익률: '+(paid?(v/paid*100-100).toFixed(1):'0')+'%<br>목표 달성 예상: '+target+'<br>초기 자금 매수 가능 수량: '+(unit?Math.floor(num('initial')/unit):0).toLocaleString()+'주<br>목표 주식 수 필요 금액: '+money(num('targetShares')*unit);let gross=num('shares')*num('distribution')*num('divFx'),net=gross*(1-num('tax')/100),perShare=num('distribution')*num('divFx')*(1-num('tax')/100),needed=perShare>0?Math.ceil(num('incomeGoal')/perShare):0;$('divResult').innerHTML='<b>월 세후 분배금: '+money(net)+'</b><br>연 세후 분배금 (12개월 가정): '+money(net*12)+'<br>매수 필요금액: '+money(num('shares')*num('divPrice')*num('divFx'))+'<br>목표 월분배금 필요 주식: '+needed.toLocaleString()+'주<br>목표 월분배금 필요 투자금: '+money(needed*num('divPrice')*num('divFx'))}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));async function data(symbol){let r=await fetch('/api/market?symbol='+encodeURIComponent(symbol));if(!r.ok)throw Error('시세 API 오류');return r.json()}async function loadEtf(){try{let a=await data(etf);if(a.price)$('price').value=a.price;if(a.cagr!=null){$('rate').value=a.cagr.toFixed(2);$('hist').textContent='과거 '+a.years.toFixed(1)+'년 가격 기준 CAGR (배당 제외): '+a.cagr.toFixed(2)+'%'}calc()}catch(e){$('hist').textContent='과거 데이터 불러오기 실패 — 직접 입력 가능'}}async function loadDiv(){try{let a=await data(divEtf);if(a.price)$('divPrice').value=a.price;if(a.lastDistribution!=null)$('distribution').value=a.lastDistribution;calc()}catch(e){$('status').textContent='분배금 데이터 불러오기 실패. 수동 입력 가능.'}}async function start(){try{let a=await Promise.all([data('^NDX'),data('^GSPC')]);for(let i=0;i<2;i++){let p=i?'sp':'nas';$(p).textContent=a[i].price?.toLocaleString('en-US')||'데이터 없음';$(p+'chg').textContent=a[i].changePct==null?'':a[i].changePct.toFixed(2)+'% (전일 대비)'}}catch(e){$('nas').textContent='조회 실패';$('sp').textContent='조회 실패'}loadEtf();loadDiv()}calc();start();</script></body></html>
